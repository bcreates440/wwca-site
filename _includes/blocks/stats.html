{%- comment -%}
  A row of big numbers. Each one is a figure and a short label under it.
{%- endcomment -%}
{%- assign b = include.b -%}
  <section class="band-{{ b.band | default: 'paper' }}" style="padding-block:2.4rem">
    <div class="wrap">
      <ul class="stats" style="list-style:none;margin:0;padding:0">
        {%- for s in b.stats %}
        <li class="stat"><b>{{ s.figure }}</b><span>{{ s.label }}</span></li>
        {%- endfor %}
      </ul>
    </div>
  </section>
