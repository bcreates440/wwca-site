<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Edit the WWCA website</title>
<link rel="icon" href="../images/logo.png" type="image/png">
<style>
  /* Shown only for the second or two before the editor loads. */
  body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       color:#14264F;background:#F7F5F0}
  .boot{max-width:30rem;margin:18vh auto;padding:0 1.25rem;text-align:center}
  .boot img{width:72px;height:72px}
  .boot h1{font-size:1.25rem;margin:1rem 0 .25rem}
  .boot p{color:#4A4E58;margin:0}
</style>
</head>
<body>

<div class="boot" id="boot">
  <img src="../images/logo.png" alt="" width="72" height="72">
  <h1>Opening the website editor</h1>
  <p>One moment. If this message stays on screen, the editor could not start &mdash;
     check your internet connection and reload the page.</p>
</div>

<script>
  // ponytail: Sveltia validates extension/format pairs more strictly than
  // Decap did and rejects extension:html + format:yaml-frontmatter outright
  // (blocks the whole editor with a config-error screen), even though it
  // parses identically to what Decap always did. Registering a genuine
  // custom format (Sveltia's documented escape hatch, see
  // https://sveltiacms.app/en/docs/api/file-formats) sidesteps that without
  // renaming every _content/*.html file to .md. Verified this round-trips
  // every real page in this template family (parse -> stringify -> parse
  // gives back the same data).
  window.CMS_MANUAL_INIT = true;
</script>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
<script type="module">
  import YAML from "https://unpkg.com/yaml@2.9.1/browser/index.js";

  const FRONT_MATTER = /^---\n(?:(?<head>[\s\S]*?))\n---(?:\n(?<body>[\s\S]*))?$/s;

  CMS.registerCustomFormat("html-frontmatter", "html", {
    fromFile: (text) => {
      const { head, body } = text.match(FRONT_MATTER)?.groups ?? {};
      const data = head ? YAML.parse(head) ?? {} : {};
      return body ? { ...data, body: body.replace(/^\n/, "") } : data;
    },
    toFile: (data) => {
      const { body, ...rest } = data;
      const head = YAML.stringify(rest, { lineWidth: 0 });
      return body ? `---\n${head}---\n\n${body}` : `---\n${head}---\n`;
    },
  });

  CMS.init();
</script>
<script>
  // Hide the holding message once the editor has taken over the page.
  window.addEventListener("load", function () {
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (boot && document.querySelector("#nc-root, .css-nc-root")) boot.remove();
    }, 1500);
    // ponytail: fallback in case Sveltia's mount selector ever diverges from
    // Decap's #nc-root convention it currently reuses; remove boot regardless
    // after 6s so a selector mismatch doesn't strand the loading message.
    setTimeout(function () {
      var boot = document.getElementById("boot");
      if (boot) boot.remove();
    }, 6000);
  });
</script>

</body>
</html>
